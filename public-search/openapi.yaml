openapi: 3.0.3
info:
  title: Atlas Public Search API
  version: 1.0.0
  description: |
    HTTP contract for the Atlas public-search service. Read endpoints are public;
    crawl and administration endpoints require the configured bearer token.
servers:
  - url: http://localhost:8787
tags:
  - name: Service
  - name: Search
  - name: Crawls
  - name: Administration
paths:
  /health:
    get:
      tags: [Service]
      summary: Liveness probe
      responses:
        '200':
          description: Process and database are responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      tags: [Service]
      summary: Readiness probe
      responses:
        '200':
          description: Service is ready to accept requests.
          content:
            application/json:
              schema:
                type: object
                required: [ok, ready]
                properties:
                  ok: { type: boolean, example: true }
                  ready: { type: boolean, example: true }
  /v1/search:
    get:
      tags: [Search]
      summary: Search indexed public documents
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, newest], default: relevance }
        - name: domain
          in: query
           schema: { type: string, example: example.com }
        - name: language
          in: query
          schema: { type: string, enum: [ko, en, ja, zh, other] }
        - name: documentType
          in: query
          schema: { type: string, enum: [html, xhtml] }
        - name: from
          in: query
          description: Inclusive indexed date, YYYY-MM-DD.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive indexed date, YYYY-MM-DD.
          schema: { type: string, format: date }
      responses:
        '200':
          description: A page of matching documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/search/suggestions:
    get:
      tags: [Search]
      summary: Suggest public indexed titles and domains without retaining query history
      parameters:
        - $ref: '#/components/parameters/Query'
      responses:
        '200': { description: Up to eight suggestions derived from public indexed documents. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/crawls:
    get:
      tags: [Crawls]
      security: [{ bearerAuth: [] }]
      summary: List crawl jobs
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CrawlStatus' }
      responses:
        '200': { description: Crawl jobs, paginated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Crawls]
      security: [{ bearerAuth: [] }]
      summary: Submit a crawl job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrawlRequest' }
      responses:
        '202':
          description: Crawl accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrawlJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /v1/crawls/summary:
    get:
      tags: [Crawls]
      security: [{ bearerAuth: [] }]
      summary: Get crawl status totals
      responses:
        '200': { description: Crawl totals by status. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/crawls/{id}:
    get:
      tags: [Crawls]
      security: [{ bearerAuth: [] }]
      summary: Get crawl job and frontier summary
      parameters: [{ $ref: '#/components/parameters/CrawlId' }]
      responses:
        '200': { description: Crawl job and frontier progress, including retry and active lease counts with their next expiry times. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Crawls]
      security: [{ bearerAuth: [] }]
      summary: Cancel an active crawl job
      parameters: [{ $ref: '#/components/parameters/CrawlId' }]
      responses:
        '202': { description: Crawl cancellation accepted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/crawls/{id}/pause:
    post:
      tags: [Crawls]
      security: [{ bearerAuth: [] }]
      summary: Pause a queued or running crawl
      parameters: [{ $ref: '#/components/parameters/CrawlId' }]
      responses: { '202': { description: Crawl paused. }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { description: Crawl cannot be paused. } }
  /v1/crawls/{id}/resume:
    post:
      tags: [Crawls]
      security: [{ bearerAuth: [] }]
      summary: Resume a paused crawl
      parameters: [{ $ref: '#/components/parameters/CrawlId' }]
      responses: { '202': { description: Crawl queued. }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { description: Crawl cannot be resumed. } }
  /v1/crawls/{id}/restart:
    post:
      tags: [Crawls]
      security: [{ bearerAuth: [] }]
      summary: Restart a terminal crawl
      parameters: [{ $ref: '#/components/parameters/CrawlId' }]
      responses: { '202': { description: Crawl queued. }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { description: Crawl cannot be restarted. } }
  /v1/crawls/{id}/frontier:
    get:
      tags: [Crawls]
      security: [{ bearerAuth: [] }]
      summary: List frontier entries for a crawl, including persisted failure type, message, and timestamp
      parameters:
        - $ref: '#/components/parameters/CrawlId'
        - $ref: '#/components/parameters/Page'
        - name: state
          in: query
          schema: { type: string, enum: [queued, processing, fetched, failed] }
      responses: { '200': { description: Paginated frontier entries. }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/crawls/{id}/frontier/retry:
    post:
      tags: [Crawls]
      security: [{ bearerAuth: [] }]
      summary: Retry failed frontier entries in a terminal crawl
      parameters: [{ $ref: '#/components/parameters/CrawlId' }]
      responses: { '202': { description: Retry accepted. }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { description: Retry unavailable. } }
  /v1/crawls/{id}/pages/diagnostic:
    get:
      tags: [Crawls]
      security: [{ bearerAuth: [] }]
      summary: Inspect canonical and duplicate-cluster outcome for a crawled page
      parameters:
        - $ref: '#/components/parameters/CrawlId'
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
      responses: { '200': { description: Page canonicalization and deduplication diagnostic. }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/crawls/{id}/schedule:
    post:
      tags: [Crawls]
      security: [{ bearerAuth: [] }]
      summary: Set periodic recrawl interval
      parameters: [{ $ref: '#/components/parameters/CrawlId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [recrawlMinutes], properties: { recrawlMinutes: { type: integer, minimum: 15 } } }
      responses: { '200': { description: Schedule updated. }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/admin/stats:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Get index and crawler statistics
       responses: { '200': { description: Current statistics. }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/admin/metrics:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Get bounded operational metrics snapshot
      description: Returns database size plus document language/type, crawl lifecycle, frontier, retry, and terminal failure counters. Requires the administrator bearer token and does not expose URL-level data.
      responses: { '200': { description: Operational metrics snapshot. }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/admin/backup:
    post:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Create a consistent SQLite backup snapshot
      description: Writes a generated single-file SQLite backup to PUBLIC_SEARCH_BACKUP_DIR, or to a backups directory beside the database. The response returns only generated metadata, not a filesystem path.
       responses: { '201': { description: Backup created. }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/admin/backups:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: List generated SQLite backup snapshots
      description: Returns generated filename, size, and modification time only. Filesystem paths are never exposed.
      responses: { '200': { description: Backup inventory. }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/admin/backups/verify:
    post:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Verify a backup without restoring it
      description: Opens one generated backup read-only, runs SQLite integrity_check, confirms its schema compatibility, and reports bounded record counts. It never replaces the live database.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [file], properties: { file: { type: string, pattern: '^public-search-[A-Za-z0-9_-]+\\.sqlite$' } } }
      responses: { '200': { description: Backup verification result. }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/admin/retention:
    post:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Preview or apply retention cleanup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before]
              properties:
                before: { type: string, format: date-time }
                deleteDocuments: { type: boolean, default: false }
                dryRun: { type: boolean, default: true }
      responses: { '200': { description: Cleanup result or preview. }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/admin/search/optimize:
    post:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Optimize SQLite full-text search storage
      responses: { '200': { description: Optimization completed. }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/admin/search/rebuild-ngrams:
    post:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Rebuild the Korean n-gram fallback index from stored documents
      responses: { '200': { description: N-gram index rebuilt. }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/admin/documents:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: List indexed documents
      parameters: [{ $ref: '#/components/parameters/Page' }, { name: domain, in: query, schema: { type: string } }]
       responses: { '200': { description: Paginated document list. }, '401': { $ref: '#/components/responses/Unauthorized' } }
    delete:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Delete one indexed document
      parameters: [{ name: url, in: query, required: true, schema: { type: string, format: uri } }]
      responses: { '200': { description: Document deleted. }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/admin/documents/inspect:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Inspect stored document quality and crawl-source metadata
      parameters: [{ name: url, in: query, required: true, schema: { type: string, format: uri } }]
      responses: { '200': { description: Document inspection. }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/admin/documents/requeue:
    post:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Requeue an indexed document through an existing approved crawl frontier
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [url], properties: { url: { type: string, format: uri }, jobId: { type: string } } }
      responses: { '202': { description: Document requeued. }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { description: No eligible approved crawl source. } }
  /v1/admin/documents/delete:
    post:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Preview or delete all indexed documents for a domain
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [domain], properties: { domain: { type: string }, dryRun: { type: boolean, default: true } } }
      responses: { '200': { description: Deletion result or preview. }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/admin/domain-blocks:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: List domains blocked from crawling and indexing
      responses: { '200': { description: Active domain blocks. }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Block a domain and remove its indexed documents
      description: Cancels matching active crawl jobs, removes the domain's documents and frontier entries, and prevents future crawl submissions until unblocked. The request is recorded in the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [domain], properties: { domain: { type: string }, reason: { type: string, maxLength: 300 } } }
      responses: { '200': { description: Domain blocked and removal applied. }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
    delete:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Remove a domain crawl block
      parameters: [{ name: domain, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: Domain block removed. }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/admin/audit:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: List administration audit entries
      responses: { '200': { description: Audit entries. }, '401': { $ref: '#/components/responses/Unauthorized' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    Query: { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 1 } }
    CrawlId: { name: id, in: path, required: true, schema: { type: string } }
  responses:
    BadRequest: { description: Invalid request input. }
    Unauthorized: { description: Missing or invalid admin bearer token. }
    NotFound: { description: Resource not found. }
    UnsupportedMediaType: { description: Request must use application/json. }
    RateLimited: { description: Rate limit exceeded; inspect Retry-After. }
  schemas:
    Health:
      type: object
      required: [ok, documents]
      properties: { ok: { type: boolean }, documents: { type: integer, minimum: 0 } }
    CrawlStatus: { type: string, enum: [queued, running, paused, complete, cancelled, failed] }
    CrawlRequest:
      type: object
      required: [seedUrl]
      properties:
        seedUrl: { type: string, format: uri }
        maxPages: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        allowedHosts: { type: array, items: { type: string }, maxItems: 50 }
        recrawlMinutes: { type: integer, minimum: 15 }
        crawlPolicy: { $ref: '#/components/schemas/CrawlPolicy' }
    CrawlPolicy:
      type: object
      additionalProperties: false
      properties:
        maxDepth: { type: integer, minimum: 0, maximum: 20 }
        requestIntervalMs: { type: integer, minimum: 1000, maximum: 120000, description: Minimum delay between requests to a host for this crawl job. }
        includePatterns: { type: array, maxItems: 20, items: { type: string, maxLength: 120 } }
        excludePatterns: { type: array, maxItems: 20, items: { type: string, maxLength: 120 } }
        allowedContentTypes: { type: array, minItems: 1, items: { type: string, enum: [text/html, application/xhtml+xml] } }
    CrawlJob:
      type: object
      required: [id, seedUrl, maxPages, allowedHosts, status, indexed, skipped, failed, createdAt, updatedAt]
      properties:
        id: { type: string }
        seedUrl: { type: string, format: uri }
        maxPages: { type: integer }
        allowedHosts: { type: array, items: { type: string } }
        policy: { $ref: '#/components/schemas/CrawlPolicy' }
        status: { $ref: '#/components/schemas/CrawlStatus' }
        indexed: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FrontierEntry:
      type: object
      required: [url, state, attempts, host, depth, availableAt, discoveredAt]
      properties:
        url: { type: string, format: uri }
        state: { type: string, enum: [queued, processing, fetched, failed] }
        attempts: { type: integer, minimum: 0 }
        host: { type: string }
        depth: { type: integer, minimum: 0 }
        availableAt: { type: integer, format: int64, description: Unix epoch milliseconds; deferred retry becomes eligible at this time. }
        discoveredAt: { type: string, format: date-time }
        lastError: { type: string, nullable: true }
        failureType: { type: string, nullable: true, enum: [dns, connection, timeout, http_429, http_5xx, unknown] }
        lastFailedAt: { type: string, nullable: true, format: date-time }
        leaseOwner: { type: string, nullable: true, description: Opaque crawler worker identifier holding this URL. }
        leaseExpiresAt: { type: integer, nullable: true, format: int64, description: Unix epoch milliseconds when the processing lease expires. }
        heartbeatAt: { type: string, nullable: true, format: date-time }
    CrawlPageDiagnostic:
      type: object
      required: [url, host, noindex, nofollow, canonicalOutcome, indexed, updatedAt]
      properties:
        url: { type: string, format: uri }
        host: { type: string }
        noindex: { type: boolean }
        nofollow: { type: boolean }
        canonicalUrl: { type: string, nullable: true, format: uri }
        canonicalOutcome: { type: string, enum: [none, accepted, rejected] }
        duplicateOf: { type: string, nullable: true, format: uri }
        indexed: { type: boolean }
        updatedAt: { type: string, format: date-time }
    SearchResponse:
      type: object
      required: [query, page, pageSize, total, totalPages, results, facets, source]
      properties:
        query: { type: string }
        sort: { type: string, enum: [relevance, newest] }
        domain: { type: string, nullable: true }
        language: { type: string, nullable: true, enum: [ko, en, ja, zh, other] }
        documentType: { type: string, nullable: true, enum: [html, xhtml] }
        page: { type: integer }
        pageSize: { type: integer, example: 20 }
        total: { type: integer }
        totalPages: { type: integer }
        results:
          type: array
          items: { type: object, required: [title, url, preview, indexedAt, score], properties: { title: { type: string }, url: { type: string, format: uri }, preview: { type: string }, indexedAt: { type: string, format: date-time }, score: { type: number, description: Relevance score combining weighted FTS field matches, URL match, bounded freshness, capped indexed in-link authority, and content-quality adjustments; not comparable across different queries. } } }
        facets: { type: object }
        source: { type: string, example: atlas-public-starter }
