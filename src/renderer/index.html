<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="features.css">
  <link rel="stylesheet" href="enhancements.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' https: data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; base-uri 'none'; form-action 'self'">
</head>
<body>
  <main class="shell" id="shell">
    <header class="topbar">
      <div class="brand"><i></i><span>ATLAS</span><small>PRIVATE WEB</small></div>
      <div class="window-actions"><button id="window-minimize" aria-label="최소화">-</button><button id="window-maximize" aria-label="최대화">□</button><button id="window-close" aria-label="닫기">×</button></div>
    </header>
    <section class="tab-strip"><div id="tabs" class="tabs"></div><button id="restore-tab" class="restore-tab" title="최근 닫은 탭 열기" aria-label="최근 닫은 탭 열기">↶</button><button id="new-tab" class="new-tab" aria-label="새 탭">+</button></section>
    <nav class="nav">
      <button id="back" title="뒤로" aria-label="뒤로">←</button><button id="forward" title="앞으로" aria-label="앞으로">→</button><button id="reload" title="새로고침" aria-label="새로고침">↻</button>
      <form id="address-form"><span class="address-lock">⌕</span><input id="address" autocomplete="off" spellcheck="false" placeholder="검색하거나 웹 주소 입력" /></form>
      <button id="find-page" title="페이지에서 찾기 (Ctrl+F)" aria-label="페이지에서 찾기">⌕</button><button id="zoom-out" title="축소" aria-label="축소">−</button><button id="zoom-reset" title="확대/축소 초기화" aria-label="확대/축소 초기화">100%</button><button id="zoom-in" title="확대" aria-label="확대">+</button><button id="bookmark" title="북마크" aria-label="북마크">☆</button><button id="toggle-side" class="atlas-toggle" title="Atlas 도구" aria-label="Atlas 도구">ATLAS</button>
    </nav>
    <section class="workspace">
      <aside class="side" aria-label="Atlas 도구">
        <div class="panel-title"><span>ATLAS TOOLS</span><button id="collapse-side" aria-label="패널 닫기">×</button></div>
        <div class="panel-caption">내 Atlas와 공개 Atlas 인덱스를 함께 탐색합니다.</div>
        <div class="side-actions"><button id="crawl-current" class="crawl-action" title="현재 사이트 수집">이 사이트 수집</button><button id="add-note" class="note-action" title="선택한 문장으로 노트 만들기">노트 추가</button></div>
        <button class="side-item active" data-panel="structure"><b>01</b> 페이지 개요</button><button class="side-item" data-panel="search"><b>02</b> 통합 검색</button><button class="side-item" data-panel="crawler"><b>03</b> 수집기</button><button class="side-item" data-panel="graph"><b>04</b> 연결 지도</button><button class="side-item" data-panel="notes"><b>05</b> 노트</button><button class="side-item" data-panel="bookmarks"><b>06</b> 북마크</button><button class="side-item" data-panel="history"><b>07</b> 방문 기록</button><button class="side-item" data-panel="backup"><b>08</b> 백업</button>
        <div id="panel-content" class="panel-content"></div>
      </aside>
      <section class="page">
        <div id="empty" class="empty">
          <p class="eyebrow">A QUIET PLACE TO EXPLORE</p>
          <h1>웹을,<br><em>내 방식으로.</em></h1>
          <p class="home-copy">주소를 열어 탐색하세요. 마음에 드는 사이트는 Atlas에 수집하면, 이후에는 외부 검색엔진 없이 내 라이브러리에서 바로 찾을 수 있습니다.</p>
          <form id="home-search" class="home-search"><div><input id="home-query" autocomplete="off" spellcheck="false" placeholder="무엇을 찾고 있나요?" /><button type="submit">검색</button></div></form>
          <div class="home-shortcuts"><button data-home-url="https://www.google.com">Google</button><button data-home-url="https://www.youtube.com">YouTube</button><button data-home-url="https://github.com">GitHub</button><button data-home-panel="bookmarks">북마크</button></div>
          <p class="search-hint"><kbd>Ctrl</kbd> <kbd>L</kbd> 주소창으로 이동 · <kbd>Ctrl</kbd> <kbd>T</kbd> 새 탭</p>
        </div>
        <section id="search-view" class="search-view" aria-live="polite"></section>
        <div id="views" class="views"></div>
      </section>
    </section>
    <section id="find-bar" class="find-bar" role="search" aria-label="페이지에서 찾기" hidden><input id="find-query" type="search" placeholder="페이지에서 찾기" autocomplete="off" /><span id="find-count">0 / 0</span><button id="find-previous" type="button" title="이전 결과">↑</button><button id="find-next" type="button" title="다음 결과">↓</button><button id="find-close" type="button" aria-label="찾기 닫기">×</button></section>
    <footer><span id="status"><i></i> READY</span><span id="download-status" title="다운로드 상태"></span><span id="page-info">0 PAGES IN ATLAS</span></footer>
  </main>
  <dialog id="note-dialog"><form id="note-form" method="dialog"><div class="note-dialog-head"><p class="eyebrow" id="note-mode">CAPTURE A THOUGHT</p><button type="button" id="close-note" aria-label="닫기">×</button></div><h2>지식 노트</h2><blockquote id="note-quote"></blockquote><label>메모<textarea id="note-body" rows="4" placeholder="이 문장이 왜 중요한가요?"></textarea></label><label>태그 <small>쉼표로 구분</small><input id="note-tags" placeholder="예: 디자인, 아이디어" /></label><div class="note-form-actions"><button type="button" id="delete-note" class="delete-note">삭제</button><button class="save-note" value="save">저장</button></div></form></dialog>
  <script src="../../build/renderer/app.js"></script>
</body>
</html>
