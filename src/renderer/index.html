<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" /><title>Atlas Browser</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="features.css"></head>
<body><main class="shell">
  <header class="topbar"><div class="brand"><i></i><span>ATLAS</span><small>KNOWLEDGE BROWSER</small></div><div class="window-actions"><span></span><span></span><span></span></div></header>
  <section class="tab-strip"><div id="tabs" class="tabs"></div><button id="restore-tab" class="restore-tab" title="최근 닫은 탭 열기" aria-label="최근 닫은 탭 열기">↶</button><button id="new-tab" class="new-tab" aria-label="새 탭">+</button></section>
  <nav class="nav"><button id="back" title="뒤로">←</button><button id="forward" title="앞으로">→</button><button id="reload" title="새로고침">↻</button><form id="address-form"><input id="address" autocomplete="off" spellcheck="false" placeholder="주소를 입력하거나 검색하세요" /></form><button id="add-note" class="note-action" title="선택한 문장으로 노트 만들기">NOTE +</button><button id="bookmark" title="북마크">☆</button></nav>
  <section class="workspace"><aside class="side"><div class="panel-title"><span>EXPLORER</span><button id="collapse-side">−</button></div><button class="side-item active" data-panel="structure"><b>⌘</b> 페이지 구조</button><button class="side-item" data-panel="graph"><b>⌇</b> 지식 그래프</button><button class="side-item" data-panel="search"><b>?</b> 로컬 검색</button><button class="side-item" data-panel="notes"><b>✦</b> 지식 노트</button><button class="side-item" data-panel="bookmarks"><b>☆</b> 북마크</button><button class="side-item" data-panel="history"><b>◷</b> 방문 기록</button><div id="panel-content" class="panel-content"></div></aside><section class="page"><div id="empty" class="empty"><p class="eyebrow">YOUR WEB, MAPPED</p><h1>탐색의<br /><em>새로운 기준.</em></h1><p>문서의 구조를 읽고, 링크의 관계를 발견하세요.</p><div class="search-hint"><kbd>⌘</kbd><kbd>L</kbd> 주소 또는 검색어 입력</div></div><div id="views" class="views"></div></section></section>
  <footer><span id="status"><i></i> READY TO EXPLORE</span><span id="page-info">0 DOCUMENTS IN THIS SESSION</span></footer>
</main><dialog id="note-dialog"><form id="note-form" method="dialog"><div class="note-dialog-head"><p class="eyebrow" id="note-mode">CAPTURE A THOUGHT</p><button type="button" id="close-note" aria-label="닫기">×</button></div><h2>지식 노트</h2><blockquote id="note-quote"></blockquote><label>메모<textarea id="note-body" rows="4" placeholder="왜 이 문장이 중요한가요?"></textarea></label><label>태그 <small>쉼표로 구분</small><input id="note-tags" placeholder="예: AI, 연구, 아이디어" /></label><div class="note-form-actions"><button type="button" id="delete-note" class="delete-note">삭제</button><button class="save-note" value="save">노트 저장</button></div></form></dialog><script src="app.js"></script></body></html>
